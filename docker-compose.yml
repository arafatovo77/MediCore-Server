# MediCore Server Edition - Docker Compose setup.
#
# Before the first start, copy .env.example to .env and set at least
# POSTGRES_PASSWORD and JWT_SECRET. Compose reads .env automatically
# and substitutes the values below - the app and the database always
# share the same password, and no secret is written into this file.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medicore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.example}
      POSTGRES_DB: medicore
    volumes:
      - medicore-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicore"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://medicore:${POSTGRES_PASSWORD}@db:5432/medicore
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env - see .env.example}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"

volumes:
  medicore-db:
